<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="promo.css" />
	<style>
		body {
			width: 1400px;
			height: 560px;
		}
		.text {
			display: flex;
			position: absolute;
			top: 0;
			left: 110px;
			flex-direction: column;
			justify-content: center;
			gap: 26px;
			width: 700px;
			height: 100%;
		}
		.brand img {
			width: 84px;
			height: 84px;
		}
		.brand h1 {
			font-size: 46px;
		}
		.tagline {
			font-size: 24px;
		}
		.chips span {
			font-size: 17px;
		}
		/* The popup, scaled down to fit the tile's height */
		.popup {
			top: 40px;
			left: 920px;
			transform: scale(0.8);
			transform-origin: top left;
		}
	</style>
</head>
<body>
	<div class="text">
		<div class="brand">
			<img src="../../assets/icons/icon256.png" alt="" />
			<h1>Messenger Batch Actions</h1>
		</div>
		<p class="tagline">Clean up your Messenger in a few clicks: pick the chats, pick the action.</p>
		<div class="chips">
			<span>Archive</span><span>Unarchive</span><span>Mute</span><span>Unmute</span><span>Delete</span><span>Leave</span><span>Block</span>
		</div>
	</div>
	<iframe class="popup" src="../../html/index.html?scene=select"></iframe>
</body>
</html>
