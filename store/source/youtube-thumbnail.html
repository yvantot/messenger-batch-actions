<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<!-- The YouTube thumbnail, 1280x720: a stickman sweeps a pile of unread chats into an archive box. A 3-word hook
	     across the top in white sticker letters, on the brand's blue; no product name or logo. It has to read at feed
	     size (320x180). Kept unlike Hide Me Chat's thumbnail (yellow, words stacked on the left, a red tag). -->
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}
		body {
			position: relative;
			width: 1280px;
			height: 720px;
			overflow: hidden;
			background:
				radial-gradient(ellipse at 50% 85%, rgba(140, 210, 255, 0.55) 0%, transparent 55%),
				linear-gradient(160deg, #3aa6ff 0%, #1d6ee0 55%, #1449b8 100%);
			font-family: "Arial Black", "Segoe UI Black", Impact, sans-serif;
		}
		/* Big faint chat bubbles in the background */
		.ghost {
			position: absolute;
			opacity: 0.12;
		}
		.hook {
			position: absolute;
			top: 34px;
			right: 0;
			left: 0;
			color: #fff;
			font-size: 84px;
			letter-spacing: -1px;
			text-align: center;
			text-shadow: 0 10px 0 rgba(8, 26, 80, 0.45);
			white-space: nowrap;
			-webkit-text-stroke: 12px #0b1b4d;
			paint-order: stroke fill;
			span {
				color: #ffd84d;
			}
		}
		svg.scene {
			position: absolute;
			top: 0;
			left: 0;
		}
	</style>
</head>
<body>
	<svg class="ghost" style="top: 230px; left: -60px" width="360" height="300" viewBox="0 0 120 100"><path d="M10 10 h100 a10 10 0 0 1 10 10 v50 a10 10 0 0 1 -10 10 h-70 l-25 20 v-20 h-5 a10 10 0 0 1 -10 -10 v-50 a10 10 0 0 1 10 -10 z" fill="#fff" /></svg>
	<svg class="ghost" style="top: 170px; right: -40px" width="260" height="220" viewBox="0 0 120 100"><path d="M10 10 h100 a10 10 0 0 1 10 10 v50 a10 10 0 0 1 -10 10 h-5 v20 l-25 -20 h-70 a10 10 0 0 1 -10 -10 v-50 a10 10 0 0 1 10 -10 z" fill="#fff" /></svg>

	<div class="hook"><span>CLEAN UP</span> MESSENGER</div>

	<svg class="scene" width="1280" height="720" viewBox="0 0 1280 720">
		<defs>
			<!-- A chat bubble with an unread badge -->
			<g id="bubble">
				<path d="M-46 -30 h92 a22 22 0 0 1 22 22 v28 a22 22 0 0 1 -22 22 h-60 l-22 18 v-18 h-10 a22 22 0 0 1 -22 -22 v-28 a22 22 0 0 1 22 -22 z" fill="#fff" stroke="#111" stroke-width="7" stroke-linejoin="round" />
				<g fill="#c9ced8"><rect x="-36" y="-12" width="60" height="10" rx="5" /><rect x="-36" y="6" width="40" height="10" rx="5" /></g>
				<circle cx="58" cy="-30" r="22" fill="#ff3b3b" stroke="#111" stroke-width="5" />
				<text x="58" y="-22" font-family="Arial Black, Arial" font-size="20" fill="#fff" text-anchor="middle">99+</text>
			</g>
			<!-- A four-point sparkle -->
			<path id="sparkle" d="M0 -26 C4 -6 6 -4 26 0 C6 4 4 6 0 26 C-4 6 -6 4 -26 0 C-6 -4 -4 -6 0 -26 Z" fill="#fff" />
		</defs>

		<!-- Sparkles by the words that matter -->
		<use href="#sparkle" transform="translate(96 52) scale(0.8)" />
		<use href="#sparkle" transform="translate(126 140) scale(0.45)" />
		<use href="#sparkle" transform="translate(1196 60) scale(0.6)" />

		<!-- The archive box, on the left: the chats' way out -->
		<g transform="translate(300 545)">
			<rect x="-92" y="-24" width="184" height="150" rx="20" fill="#ff8a65" stroke="#111" stroke-width="8" />
			<rect x="-108" y="-70" width="216" height="56" rx="16" fill="#ff7043" stroke="#111" stroke-width="8" />
			<rect x="-34" y="20" width="68" height="22" rx="11" fill="#fff" stroke="#111" stroke-width="5" />
		</g>
		<!-- A clean little shine on the box -->
		<use href="#sparkle" transform="translate(190 440) scale(0.55)" />

		<!-- A stream of chats flying from the pile into the box -->
		<g stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.7">
			<line x1="508" y1="402" x2="552" y2="412" /><line x1="502" y1="430" x2="540" y2="438" />
			<line x1="660" y1="322" x2="702" y2="334" /><line x1="654" y1="350" x2="690" y2="360" />
		</g>
		<use href="#bubble" transform="translate(430 420) rotate(-16) scale(0.85)" />
		<use href="#bubble" transform="translate(585 335) rotate(8) scale(0.85)" />
		<use href="#bubble" transform="translate(735 330) rotate(-6) scale(0.8)" />

		<!-- The pile still to go -->
		<use href="#bubble" transform="translate(760 618) rotate(-6)" />
		<use href="#bubble" transform="translate(860 650) rotate(8)" />
		<use href="#bubble" transform="translate(815 540) rotate(-12)" />

		<!-- The stickman, sweeping (the same one, moved left a little) -->
		<g transform="translate(-100 70) scale(0.9)">
			<g stroke="#111" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
				<!-- broom handle, from his hands down to the pile -->
				<line x1="1160" y1="330" x2="1010" y2="640" />
				<!-- body, legs -->
				<line x1="1180" y1="260" x2="1196" y2="470" />
				<line x1="1196" y1="470" x2="1150" y2="660" />
				<line x1="1196" y1="470" x2="1250" y2="650" />
				<!-- arms, both hands on the broom -->
				<polyline points="1182,300 1152,330 1137,377" />
				<polyline points="1186,312 1168,392 1115,423" />
			</g>
			<!-- broom head -->
			<path d="M980 628 l60 26 l-24 50 l-78 -30 z" fill="#b5803f" stroke="#111" stroke-width="7" stroke-linejoin="round" />
			<g stroke="#111" stroke-width="4" stroke-linecap="round">
				<line x1="952" y1="662" x2="944" y2="690" /><line x1="975" y1="672" x2="968" y2="700" /><line x1="998" y1="681" x2="992" y2="708" />
			</g>
			<!-- head: a happy, busy face -->
			<circle cx="1176" cy="190" r="70" fill="#fff" stroke="#111" stroke-width="9" />
			<circle cx="1150" cy="180" r="9" fill="#111" />
			<circle cx="1196" cy="180" r="9" fill="#111" />
			<path d="M1140 212 q36 30 72 0" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round" />
			<!-- a drop of effort -->
			<path d="M1262 150 q-12 20 0 30 q12 -10 0 -30 z" fill="#9fe3ff" stroke="#111" stroke-width="5" />
		</g>
	</svg>
</body>
</html>
