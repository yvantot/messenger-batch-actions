<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Messenger Batch Actions demo</title>
	<link rel="stylesheet" href="demo.css" />
	<!-- The demo's "Messenger", its effects and timeline; the popup in the frame below talks to it (popup-stub.js) -->
	<script src="stage.js"></script>
</head>
<body>
	<div class="stars"></div>
	<div class="halftone"></div>

	<div id="window" class="window">
		<div class="bar">
			<i></i><i></i><i></i>
			<span class="address">messenger.com</span>
			<span id="extension-icon" class="extension"></span>
		</div>
		<div class="app">
			<div class="sidebar">
				<h2>Chats <span id="badge" class="badge"></span></h2>
				<div class="search">Search Messenger</div>
				<div id="rows" class="rows"></div>
			</div>
			<div class="main">
				<div class="header"><span class="av" style="background: #4bb4c9">R</span><div class="name">Rick Sanchez</div></div>
				<div id="messages" class="messages"></div>
				<div class="composer">Aa</div>
			</div>
		</div>
	</div>

	<!-- The real popup, framed like a comic panel -->
	<div id="popup-frame" class="popup-frame">
		<iframe id="popup" class="popup" src="../../html/index.html"></iframe>
	</div>

	<!-- What's shown, top left; the name, top right, all the way through instead of a title card -->
	<div id="caption" class="caption"><span id="caption-number" class="number"></span><span id="caption-text"></span></div>
	<div class="brand"><img src="../../assets/logo.svg" alt="" /><span>Messenger Batch Actions</span></div>

	<svg id="cursor" class="cursor" viewBox="0 0 24 24" width="34" height="34">
		<path d="M4 2 L4 19 L8.5 14.8 L11.6 21.6 L14.6 20.3 L11.5 13.6 L17.6 13.6 Z" fill="#fff" stroke="#0d0d12" stroke-width="1.8" stroke-linejoin="round" />
	</svg>
</body>
</html>
